#version: "3.9"

services:

  # ---------------------------------------------------------
  # MAIN DATABASE (PostgreSQL)
  # ---------------------------------------------------------
  main_db:
    image: postgres:15
    container_name: main_db
    restart: always
    environment:
      POSTGRES_USER: ily19
      POSTGRES_PASSWORD: ily19-_-
      POSTGRES_DB: airbnb
    ports:
      - "5433:5432"
    volumes:
      - main_pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ily19 -d airbnb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------
  # RESERVATION DATABASE (PostgreSQL)
  # ---------------------------------------------------------
  reservation_db:
    image: postgres:15
    container_name: reservation_db
    restart: always
    environment:
      POSTGRES_USER: ily19
      POSTGRES_PASSWORD: ily19-_-
      POSTGRES_DB: reservation_db
    ports:
      - "5434:5432"
    volumes:
      - reservation_pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ily19 -d reservation_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------
  # REDIS (for caching)
  # ---------------------------------------------------------
  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 2s
      retries: 5

  # ---------------------------------------------------------
  # MAIN API SERVICE
  # ---------------------------------------------------------
  main_api:
    build: .
    container_name: main_api
    # 👇 ADD THIS LINE BELOW:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      main_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      reservation_api:
        condition: service_started
    environment:
      SERVICE_NAME: main_api
      DATABASE_URL: postgresql://ily19:ily19-_-@main_db:5432/airbnb
      REDIS_URL: redis://redis:6379
      RESERVATION_SERVICE_URL: http://reservation_api:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8000:8000"
    networks:
      - backend

  # ---------------------------------------------------------
  # RESERVATION MICROSERVICE
  # ---------------------------------------------------------
  reservation_api:
    build: ./reservation_service
    container_name: reservation_api
    # 👇 ADD THIS LINE BELOW:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      reservation_db:
        condition: service_healthy
    environment:
      SERVICE_NAME: reservation_api
      DATABASE_URL: postgresql://ily19:ily19-_-@reservation_db:5432/reservation_db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      REDIS_URL: redis://redis:6379
    ports:
      - "8001:8001"
    networks:
      - backend
  # ---------------------------------------------------------
  # CELERY
  # ---------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://ily19:ily19-_-@main_db:5432/airbnb
    depends_on:
      - redis
      - main_db
    volumes:
      - ./app:/app/app
    networks:
      - backend
  # ---------------------------------------------------------
  # PROMETHEUS
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend

  # ---------------------------------------------------------
  # GRAFANA
  # ---------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend

  # ---------------------------------------------------------
  # TEMPO
  # ---------------------------------------------------------
  tempo:
    image: grafana/tempo:2.4.1
    ports:
      - "4318:4318"   # OTLP HTTP ingest endpoint
    networks:
      - backend
    command: [ "--storage.trace.backend=local" ]

  # ---------------------------------------------------------
  # JAEGER
  # ---------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - backend
# ---------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------
volumes:
  main_pgdata:
  reservation_pgdata:
  grafana_data:

# ---------------------------------------------------------
# NETWORKS
# ---------------------------------------------------------
networks:
  backend:
    driver: bridge
